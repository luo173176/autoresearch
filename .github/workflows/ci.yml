name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
      - name: Lint
        run: >-
          ruff check
          src/autoresearch/config.py
          src/autoresearch/db.py
          src/autoresearch/jobs.py
          src/autoresearch/worker.py
          src/autoresearch/cli.py
          src/autoresearch/security.py
          src/autoresearch/research.py
          src/autoresearch/schemas.py
          src/autoresearch/api/main.py
          src/autoresearch/api/routes.py
          src/autoresearch/experiments/__init__.py
          src/autoresearch/sandbox/docker_runner.py
          tests/conftest.py
          tests/test_experiments.py
          tests/test_m3_resilience.py
          tests/test_m4_jobs.py
          tests/test_m5_worker.py
          tests/test_m6_access_priority.py
          tests/test_m7_api_keys.py
          tests/test_m8_research_modes.py
          --select E4,E7,E9,F --ignore E501,F401,F811,I001
      - name: Format check
        run: >-
          ruff format --check
          src/autoresearch/config.py
          src/autoresearch/db.py
          src/autoresearch/jobs.py
          src/autoresearch/worker.py
          src/autoresearch/cli.py
          src/autoresearch/security.py
          src/autoresearch/research.py
          src/autoresearch/schemas.py
          src/autoresearch/api/main.py
          src/autoresearch/api/routes.py
          src/autoresearch/experiments/__init__.py
          src/autoresearch/sandbox/docker_runner.py
          tests/conftest.py
          tests/test_experiments.py
          tests/test_m3_resilience.py
          tests/test_m4_jobs.py
          tests/test_m5_worker.py
          tests/test_m6_access_priority.py
          tests/test_m7_api_keys.py
          tests/test_m8_research_modes.py
      - name: Tests
        run: pytest

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install pip-audit
      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: autoresearch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
