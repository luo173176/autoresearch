[project]
name = "autoresearch"
version = "0.2.0"
description = "AutoResearch —— 自主科研与实验平台：文献调研、知识图谱、假设生成、实验设计、沙箱执行、报告产出"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutoResearch" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "loguru>=0.7",
    "httpx>=0.27",
    "openai>=1.50",
    "tenacity>=8.5",
    "streamlit>=1.38",
    "pymupdf>=1.24",
    "networkx>=3.3",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
autoresearch = "autoresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
